<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeaWhiz AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #D85A3A;
            --accent: #F5A442;
            --bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --surface: #f9fafb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --text: #f3f4f6;
                --text-light: #d1d5db;
                --border: #374151;
                --surface: #1f2937;
            }
        }

        body {
            width: 500px;
            /* No fixed height: the popup starts just tall enough for the
               search bar, then grows automatically as the response area
               below it expands (up to response-container's own max-height,
               where it switches to internal scrolling instead). */
            height: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .response-container {
            /* Hidden by default so only the search bar shows; JS adds
               .active the moment there's a message or a streamed answer,
               which is what makes it "expand" underneath the search bar. */
            display: none;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
        }

        .response-container.active {
            display: flex;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .response-container::-webkit-scrollbar {
            width: 6px;
        }

        .response-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .loading-state {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 16px;
        }

        .loading-state.show {
            display: flex;
        }

        .teacup-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            animation: floatTeacup 2s ease-in-out infinite,
                       glowEffect 2s ease-in-out infinite;
        }

        /* Teacup mark inline at the start of the search bar (Gemini-style
           leading icon). The cup itself stays put - no bobbing - only the
           glow pulses; real rising steam comes from .steam-wisp below. */
        .tea-icon {
            position: relative;
            display: inline-flex;
            flex-shrink: 0;
            align-self: center;
        }

        .input-icon {
            display: block;
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 7px rgba(216, 90, 58, 0.65))
                    drop-shadow(0 0 2px rgba(216, 90, 58, 0.8));
            animation: glowEffect 2s ease-in-out infinite;
        }

        /* Rises from roughly where the cup's painted steam tip sits and
           fades out above the icon, on a loop, staggered per wisp. */
        .steam-wisp {
            position: absolute;
            top: 8px;
            width: 4px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(to top, rgba(245, 164, 66, 0.85), rgba(245, 164, 66, 0));
            filter: blur(1px);
            opacity: 0;
            animation: steamRise 2.4s ease-in-out infinite;
        }

        .steam-wisp.w1 { left: 21px; animation-delay: 0s; }
        .steam-wisp.w2 { left: 30px; animation-delay: 0.8s; }
        .steam-wisp.w3 { left: 25px; animation-delay: 1.6s; }

        @keyframes steamRise {
            0%   { transform: translateY(0) scaleX(1); opacity: 0; }
            20%  { opacity: 0.7; }
            60%  { opacity: 0.35; }
            100% { transform: translateY(-24px) scaleX(1.6); opacity: 0; }
        }

        @keyframes floatTeacup {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes glowEffect {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(245, 164, 66, 0.2)); }
            50% { filter: drop-shadow(0 0 8px rgba(245, 164, 66, 0.4)); }
        }

        .loading-text {
            color: var(--primary);
            font-style: italic;
            font-size: 13px;
            font-weight: 500;
        }

        .response {
            display: none;
            padding: 12px;
            background-color: var(--surface);
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            color: var(--text);
        }

        .response.show {
            display: block;
        }

        /* Message Styles */
        .message {
            display: flex;
            margin-bottom: 12px;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-content {
            background: var(--primary);
            color: white;
            border-radius: 12px 12px 4px 12px;
        }

        .message.assistant .message-content {
            background: var(--surface);
            color: var(--text);
            border-radius: 12px 12px 12px 4px;
            border-left: 3px solid var(--primary);
        }

        .message.error .message-content {
            background: rgba(220, 38, 38, 0.1);
            color: #991b1b;
            border-left: 3px solid #dc2626;
        }

        .message-content {
            padding: 12px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }

        .loading-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            animation: floatTeacup 2s ease-in-out infinite,
                       glowEffect 2s ease-in-out infinite;
        }

        .loading-text-inline {
            color: var(--primary);
            font-style: italic;
            font-size: 13px;
            font-weight: 500;
        }

        .error {
            display: none;
        }

        .error.show {
            display: block;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--surface);
            border-radius: 24px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(216, 90, 58, 0.1);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 20px;
            max-height: 100px;
        }

        textarea::placeholder {
            color: var(--text-light);
        }

        .button-group {
            display: flex;
            gap: 6px;
        }

        button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        button:hover:not(:disabled) {
            background: var(--border);
            transform: scale(1.1);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            width: 36px;
            height: 36px;
        }

        .submit-btn:hover:not(:disabled) {
            background: #c44829;
            box-shadow: 0 2px 8px rgba(216, 90, 58, 0.3);
        }

        /* Markdown rendering styles - Enhanced beauty */
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4,
        .message-content h5,
        .message-content h6 {
            margin-top: 16px;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .message-content h1 {
            font-size: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
        }

        .message-content h2 {
            font-size: 18px;
            color: var(--primary);
        }

        .message-content h3 {
            font-size: 16px;
            color: var(--primary);
        }

        .message-content p {
            margin-bottom: 12px;
            line-height: 1.7;
            color: var(--text);
        }

        .message-content ul,
        .message-content ol {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .message-content li {
            margin-bottom: 6px;
            line-height: 1.6;
            color: var(--text);
        }

        .message-content code {
            background: rgba(216, 90, 58, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: "Fira Code", "Monaco", "Courier New", monospace;
            font-size: 13px;
            color: var(--primary);
            font-weight: 500;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.08);
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 12px 0;
            font-size: 12px;
            line-height: 1.5;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
            color: var(--text);
            font-weight: 400;
        }

        .message-content blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 16px;
            margin-left: 0;
            margin-bottom: 12px;
            color: var(--text-light);
            font-style: italic;
            background: rgba(216, 90, 58, 0.05);
            padding: 12px 16px;
            border-radius: 4px;
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 13px;
            border: none;
        }

        .message-content table th,
        .message-content table td {
            border: none;
            padding: 10px 0;
            text-align: left;
            border-bottom: 1px solid rgba(216, 90, 58, 0.2);
        }

        .message-content table th {
            background: transparent;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.3px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
        }

        .message-content table tr:nth-child(even) {
            background: transparent;
        }

        .message-content table tr:hover {
            background: transparent;
        }

        .message-content table tr:last-child td {
            border-bottom: none;
        }

        .message-content strong {
            font-weight: 700;
            color: var(--primary);
        }

        .message-content em {
            font-style: italic;
            color: var(--text-light);
        }

        .message-content a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 2px solid var(--primary);
            transition: all 0.2s;
        }

        .message-content a:hover {
            opacity: 0.8;
        }

        .message-content hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 16px 0;
        }

        /* Beautiful list styling */
        .message-content ul li::marker {
            color: var(--primary);
            font-weight: bold;
        }

        .message-content ol li::marker {
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Input Area (top) -->
        <div class="input-area">
            <div class="tea-icon">
                <img src="../public/icon.png" alt="TeaWhiz AI" class="input-icon">
                <span class="steam-wisp w1"></span>
                <span class="steam-wisp w2"></span>
                <span class="steam-wisp w3"></span>
            </div>
            <div class="input-wrapper">
                <textarea
                    id="prompt"
                    placeholder="TeaWhiz AI..."
                    rows="1"
                ></textarea>
                <div class="button-group">
                    <button id="clearBtn" title="Clear">✕</button>
                </div>
            </div>
            <button id="submit" class="submit-btn" title="Send">⬆</button>
        </div>

        <!-- Response Area: hidden until there's something to show, then
             expands automatically below the search bar (see .response-container.active) -->
        <div class="response-container" id="responseContainer">
            <div id="messagesContainer"></div>
        </div>
    </div>

    <!-- popup.ts imports and bundles the marked markdown parser locally -->
    <script src="popup.ts" type="module"></script>
</body>
</html>
