<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeaWhiz AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #D85A3A;
            --accent: #F5A442;
            --bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --surface: #f9fafb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --text: #f3f4f6;
                --text-light: #d1d5db;
                --border: #374151;
                --surface: #1f2937;
            }
        }

        body {
            width: 500px;
            height: 600px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            gap: 12px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 36px;
            height: 36px;
        }

        .brand {
            flex: 1;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .response-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .response-container::-webkit-scrollbar {
            width: 6px;
        }

        .response-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .loading-state {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 16px;
        }

        .loading-state.show {
            display: flex;
        }

        .teacup-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            animation: floatTeacup 2s ease-in-out infinite,
                       glowEffect 2s ease-in-out infinite;
        }

        @keyframes floatTeacup {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes glowEffect {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(245, 164, 66, 0.2)); }
            50% { filter: drop-shadow(0 0 8px rgba(245, 164, 66, 0.4)); }
        }

        .loading-text {
            color: var(--primary);
            font-style: italic;
            font-size: 13px;
            font-weight: 500;
        }

        .response {
            display: none;
            padding: 12px;
            background-color: var(--surface);
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            color: var(--text);
        }

        .response.show {
            display: block;
        }

        /* Message Styles */
        .message {
            display: flex;
            margin-bottom: 12px;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-content {
            background: var(--primary);
            color: white;
            border-radius: 12px 12px 4px 12px;
        }

        .message.assistant .message-content {
            background: var(--surface);
            color: var(--text);
            border-radius: 12px 12px 12px 4px;
            border-left: 3px solid var(--primary);
        }

        .message.error .message-content {
            background: rgba(220, 38, 38, 0.1);
            color: #991b1b;
            border-left: 3px solid #dc2626;
        }

        .message-content {
            padding: 12px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }

        .loading-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            animation: floatTeacup 2s ease-in-out infinite,
                       glowEffect 2s ease-in-out infinite;
        }

        .loading-text-inline {
            color: var(--primary);
            font-style: italic;
            font-size: 13px;
            font-weight: 500;
        }

        .error {
            display: none;
        }

        .error.show {
            display: block;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-light);
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 13px;
            max-width: 200px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px 0;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--surface);
            border-radius: 24px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(216, 90, 58, 0.1);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 20px;
            max-height: 100px;
        }

        textarea::placeholder {
            color: var(--text-light);
        }

        .button-group {
            display: flex;
            gap: 6px;
        }

        button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        button:hover:not(:disabled) {
            background: var(--border);
            transform: scale(1.1);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            width: 36px;
            height: 36px;
        }

        .submit-btn:hover:not(:disabled) {
            background: #c44829;
            box-shadow: 0 2px 8px rgba(216, 90, 58, 0.3);
        }

        /* Markdown rendering styles */
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4,
        .message-content h5,
        .message-content h6 {
            margin-top: 12px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .message-content h1 { font-size: 18px; }
        .message-content h2 { font-size: 16px; }
        .message-content h3 { font-size: 14px; }

        .message-content p {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .message-content ul,
        .message-content ol {
            margin-left: 16px;
            margin-bottom: 8px;
        }

        .message-content li {
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 12px;
            color: var(--primary);
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.05);
            border-left: 3px solid var(--primary);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 12px;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .message-content blockquote {
            border-left: 3px solid var(--primary);
            padding-left: 12px;
            margin-left: 0;
            margin-bottom: 8px;
            color: var(--text-light);
            font-style: italic;
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 13px;
        }

        .message-content table th,
        .message-content table td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: left;
        }

        .message-content table th {
            background: var(--surface);
            font-weight: 600;
            color: var(--primary);
        }

        .message-content table tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.02);
        }

        .message-content strong {
            font-weight: 600;
            color: var(--primary);
        }

        .message-content em {
            font-style: italic;
        }

        .message-content a {
            color: var(--primary);
            text-decoration: underline;
        }

        .message-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="../public/icon.png" alt="TeaWhiz AI" class="logo">
            <div class="brand">
                <div class="brand-name">TeaWhiz AI</div>
                <div class="brand-subtitle">Ask about any webpage</div>
            </div>
        </div>

        <!-- Response Area -->
        <div class="response-container">
            <!-- Messages (conversation style) -->
            <div id="messagesContainer"></div>

            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">🫖</div>
                <div class="empty-state-text">Ask me anything about this page...</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="prompt"
                    placeholder="Ask about this page..."
                    rows="1"
                ></textarea>
                <div class="button-group">
                    <button id="clearBtn" title="Clear">✕</button>
                </div>
            </div>
            <button id="submit" class="submit-btn" title="Send">⬆</button>
        </div>
    </div>

    <!-- Markdown parser for rendering responses -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/13.0.3/marked.min.js"></script>
    <script src="popup.ts" type="module"></script>
</body>
</html>
